name: Deploy frontend to GitHub Pages

# Builds the React app and publishes it to GitHub Pages.
# Prerequisites in the repo settings:
#   1. Settings → Pages → Source = "GitHub Actions"
#   2. Settings → Secrets and variables → Actions → Variables:
#        VITE_API_BASE_URL = https://<your-railway-backend-url>

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # The backend URL (public, not a secret) — set as a repo Variable.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          # Project Pages serve from /<repo>/, so assets need that base path.
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
